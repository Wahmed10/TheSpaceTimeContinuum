name: Ingest provider data
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run due providers and record persistence evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_CONTACT: ${{ secrets.PROVIDER_CONTACT }}
          INGEST_PROVIDERS: dummy
        run: |
          export INGEST_INVOCATION_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm ingest:due
          pnpm exec tsx packages/db/src/recordIngestionProof.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ingestion-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/ingestion-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
