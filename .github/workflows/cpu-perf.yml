name: CPU performance evidence
# Reviewed Linux baseline and independent hosted comparison are in docs/perf.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Record evidence for review, or compare against an approved baseline
        type: choice
        options: [compare, record]
        default: compare
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check out the reviewed immutable reference
        if: ${{ inputs.mode != 'record' }}
        uses: actions/checkout@v4
        with:
          ref: 1a77315050f0407220cda1237f1284a30afeede1
          path: .tools/cpu-reference-checkout
          persist-credentials: false
      - name: Install reference dependencies
        if: ${{ inputs.mode != 'record' }}
        working-directory: .tools/cpu-reference-checkout
        run: pnpm install --frozen-lockfile
      - name: Run five deterministic camera paths
        env:
          CPU_MODE: ${{ inputs.mode || 'compare' }}
        run: bash tools/run-hosted-cpu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-performance-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .tools/cpu-current*.json
            .tools/cpu-reference.json
            .tools/cpu-provenance.json
            .tools/cpu-*-server.log
